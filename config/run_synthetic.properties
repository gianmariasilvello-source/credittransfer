# Credit Transfer Configuration for Synthetic Citation Graph

[input]
# Directory containing serialized graph data
data_directory = data/synthetic

# Data file prefix
data_prefix = synthetic_citation

[parameters]
# Optimization parameters
use_integer_indices = true
check_convergence = false
use_sparse_eigensolver = true

# Number of node types
num_types = 3

# Retention rates by node type
# Type 0: Papers - retain 20%
type_0_retention = 0.2

# Type 1: Datasets - retain 90%
type_1_retention = 0.9

# Type 2: Software - retain 70%
type_2_retention = 0.7

[types]
# Human-readable names for node types
type_0_name = paper
type_1_name = dataset
type_2_name = software

[output]
# Directory for output files
output_directory = output/synthetic

# Results file prefix
results_prefix = synthetic

# Number of top nodes to display by kudos
top_nodes = 50

# Save detailed credit results
save_credit_results = true

# Save summary JSON
save_summary_json = true

[experiment]
# Experiment name
name = Synthetic Citation Graph Analysis

# Description
description = Credit transfer analysis on synthetically generated citation network

# Date
date = 2025-10-26
# Synthetic Citation Graph Configuration
# Generates realistic citation networks with typical properties

[general]
# Random seed for reproducibility (remove or set to empty for random)
seed = 42

[graph]
# Total number of nodes
n_nodes = 1000

[types]
# Number of node types (e.g., papers, datasets, software)
num_types = 3

# Type 0: Papers
type_0_name = paper
type_0_proportion = 0.70

# Type 1: Datasets
type_1_name = dataset
type_1_proportion = 0.25

# Type 2: Software
type_2_name = software
type_2_proportion = 0.05

[density]
# Average number of references per paper (out-degree)
avg_out_degree = 15.0

# Variation in density (0.0 = uniform, 1.0 = highly variable)
density_variation = 0.2

[indegree]
# Power-law exponent for in-degree distribution
# Typical values: 2.0-3.0 (lower = more inequality, more highly-cited papers)
powerlaw_exponent = 2.5

[outdegree]
# Lambda parameter for exponential out-degree distribution
# Higher = more variation in number of references
exp_lambda = 0.3

[communities]
# Number of research communities/subfields
n_communities = 10

# Probability of citing within same community
within_community_prob = 0.6

# Probability of citing across communities
between_community_prob = 0.4

[structure]
# Probability of forming transitive citations (triangles)
# If A cites B and B cites C, probability that A also cites C
transitivity_prob = 0.3

# Number of hierarchical levels (?? citations from lower to higher levels)
hierarchy_levels = 5

# Bias towards citing higher hierarchical levels
# Higher = stronger preference for foundational work
level_bias = 0.7

[citation_preferences]
# Type-specific citation preferences
# Format: type_X_cites = target_type:weight, target_type:weight, ...

# Papers cite: mostly papers, some datasets, rarely software
type_0_cites = 0:1.0, 1:0.3, 2:0.1

# Datasets cite: mostly other datasets, some papers
type_1_cites = 0:0.2, 1:1.0, 2:0.1

# Software cites: datasets and papers equally, some software
type_2_cites = 0:0.5, 1:0.5, 2:0.3

[output]
# Output directory for generated files
output_dir = data/synthetic

# Prefix for output files
output_prefix = synthetic_citation

