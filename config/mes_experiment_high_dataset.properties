# MES Experiment Configuration File - High Dataset Retention
# Marine Ecosystem Studies - Alternative configuration emphasizing datasets

[input]
# Directory containing serialized MES data
data_directory = data/mes_experiment

# Data file prefix
data_prefix = mes

[parameters]
# Optimization parameters
use_integer_indices = true
check_convergence = false
use_sparse_eigensolver = true

# Number of node types (0=paper, 1=dataset, 2=software)
num_types = 3

# Retention rates by node type
# Type 0: Papers - retain 15%% (emphasize transfer to sources)
type_0_retention = 0.15

# Type 1: Datasets - retain 95%% (very high value, minimal transfer)
type_1_retention = 0.95

# Type 2: Software - retain 80%% (increased value for reusable tools)
type_2_retention = 0.80

[types]
# Human-readable names for node types
type_0_name = paper
type_1_name = dataset
type_2_name = software

[output]
# Directory for output files
output_directory = output/mes_experiment_high_dataset

# Results file prefix
results_prefix = mes_high_dataset

# Number of top nodes to display by kudos
top_nodes = 100

# Number of top authors to display by h-index
top_authors = 200

# Show detailed kudos values for each author
show_author_kudos_details = false

# Save detailed credit results
save_credit_results = true

# Save author h-indices
save_author_hindices = true

# Save experiment summary JSON
save_summary_json = true

[experiment]
# Experiment name
name = MES Credit Transfer - High Dataset Retention

# Description
description = Alternative configuration emphasizing dataset value with 95%% retention rate

# Date
date = 2025-10-26

