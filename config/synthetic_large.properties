# Large Graph - Realistic scale
# ~10,000 nodes, complex structure

[general]
seed = 999

[graph]
n_nodes = 10000

[types]
num_types = 3
type_0_name = paper
type_0_proportion = 0.75
type_1_name = dataset
type_1_proportion = 0.20
type_2_name = software
type_2_proportion = 0.05

[density]
avg_out_degree = 20.0
density_variation = 0.3

[indegree]
# Lower exponent = more highly-cited papers
powerlaw_exponent = 2.1

[outdegree]
exp_lambda = 0.35

[communities]
n_communities = 25
within_community_prob = 0.65
between_community_prob = 0.35

[structure]
transitivity_prob = 0.35
hierarchy_levels = 7
level_bias = 0.8

[citation_preferences]
type_0_cites = 0:1.0, 1:0.4, 2:0.15
type_1_cites = 0:0.25, 1:1.0, 2:0.2
type_2_cites = 0:0.6, 1:0.6, 2:0.4

[authors]
n_authors = 3000
avg_authors_per_node = 3.5
productivity_exponent = 1.8

[output]
output_dir = data/synthetic_large
output_prefix = large_citation

