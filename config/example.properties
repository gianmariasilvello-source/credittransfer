# Credit Transfer Configuration File
# Example configuration for running credit distribution analysis

[input]
# Path to adjacency matrix file (required)
# Format: space-separated matrix, one row per line
adjacency_matrix_file = data/example_adjacency.txt

# Path to node IDs file (optional)
# Format: node_id node_type (one per line, where node_type: 0=paper, 1=dataset)
node_ids_file = data/example_nodes.txt

# Path to authors file (optional)
# Format: node_id author_id1 author_id2 ... (one per line)
authors_file = data/example_authors.txt

# Path to author names file (optional)
# Format: author_id author_name (one per line)
author_names_file = data/example_author_names.txt


[parameters]
# Optimization parameters
use_integer_indices = true
check_convergence = true
use_sparse_eigensolver = true

# Retention rates by node type
# Type 0 retention rate (papers)
type_0_retention = 0.2

# Type 1 retention rate (datasets)
type_1_retention = 0.9

# Uniform retention rate (used if node types not provided)
uniform_retention = 0.2


[types]
# Human-readable names for node types
type_0_name = paper
type_1_name = dataset


[output]
# Directory for log files
log_directory = logs

# File to save detailed results (optional)
# results_file = output/results.txt

# Number of top nodes to display by kudos (0 = show all)
top_nodes = 10

# Number of top authors to display by h-index (0 = show all)
top_authors = 20

# Show detailed kudos values for each author
show_author_kudos_details = false

