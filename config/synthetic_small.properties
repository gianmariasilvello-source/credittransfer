# Small Test Graph - Fast generation for testing
# ~100 nodes, simple structure

[general]
seed = 123

[graph]
n_nodes = 100

[types]
num_types = 2
type_0_name = paper
type_0_proportion = 0.8
type_1_name = dataset
type_1_proportion = 0.2

[density]
avg_out_degree = 10.0
density_variation = 0.15

[indegree]
powerlaw_exponent = 2.3

[outdegree]
exp_lambda = 0.25

[communities]
n_communities = 5
within_community_prob = 0.7
between_community_prob = 0.3

[structure]
transitivity_prob = 0.25
hierarchy_levels = 3
level_bias = 0.6

[citation_preferences]
type_0_cites = 0:1.0, 1:0.2
type_1_cites = 0:0.1, 1:1.0

[authors]
n_authors = 50
avg_authors_per_node = 2.5
productivity_exponent = 2.0

[output]
output_dir = data/synthetic_small
output_prefix = small_citation

