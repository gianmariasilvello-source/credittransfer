# MES Experiment Configuration File
# Marine Ecosystem Studies - Credit Transfer Analysis

[input]
# Directory containing serialized MES data
data_directory = data/mes_experiment

# Data file prefix
data_prefix = mes

[parameters]
# Optimization parameters
use_integer_indices = true
check_convergence = false
use_sparse_eigensolver = true

# Number of node types (0=paper, 1=dataset, 2=software)
num_types = 3

# Retention rates by node type
# Type 0: Papers - retain 20%% (transfer 80%% to references)
type_0_retention = 0.2

# Type 1: Datasets - retain 90%% (highly valuable, transfer less)
type_1_retention = 0.9

# Type 2: Software - retain 70%% (code is reusable)
type_2_retention = 0.7

[types]
# Human-readable names for node types
type_0_name = paper
type_1_name = dataset
type_2_name = software

[output]
# Directory for output files
output_directory = output/mes_experiment

# Results file prefix
results_prefix = mes

# Number of top nodes to display by kudos (0 = show all)
top_nodes = 50

# Number of top authors to display by h-index (0 = show all)
top_authors = 100

# Show detailed kudos values for each author
show_author_kudos_details = false

# Save detailed credit results
save_credit_results = true

# Save author h-indices
save_author_hindices = true

# Save experiment summary JSON
save_summary_json = true

[experiment]
# Experiment name
name = MES Credit Transfer Analysis

# Description
description = Credit transfer analysis on Marine Ecosystem Studies dataset with author h-index calculation

# Date
date = 2025-10-26

