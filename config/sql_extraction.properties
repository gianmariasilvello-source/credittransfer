# SQL Database Extraction Configuration
# Configuration for extracting large-scale citation data from SQL databases

[database]
# PostgreSQL connection parameters
host = localhost
port = 5432
database = citations_db
user = your_username
password = your_password

[extraction]
# Batch size for SQL queries (rows per fetch)
# Larger = fewer round trips, more memory
# Recommended: 100000-500000
batch_size = 100000

# Output directory for serialized files
output_dir = data/large_scale_experiment

# Prefix for output files
prefix = nature_data

[options]
# Extract author names (set to false to save memory)
extract_author_names = true

# Compress output files (slower write, smaller files)
compress_output = true

[retention]
# Default retention rates for credit transfer
paper_retention = 0.5
patent_retention = 0.5
clinical_trial_retention = 0.5
