# MES Experiment Configuration - All Paper Transit
# Papers transfer all credit (0%% retention)

[input]
data_directory = data/mes_experiment
data_prefix = mes

[parameters]
use_integer_indices = true
check_convergence = false
use_sparse_eigensolver = true
num_types = 3

# Type 0: Papers - 0%% retention (transfer everything)
type_0_retention = 0.0

# Type 1: Datasets - 100%% retention (keep all)
type_1_retention = 1.0

# Type 2: Software - 100%% retention (keep all)
type_2_retention = 1.0

[types]
type_0_name = paper
type_1_name = dataset
type_2_name = software

[output]
output_directory = output/mes_experiment_no_paper
results_prefix = mes_no_paper
top_nodes = 50
top_authors = 100
save_credit_results = true
save_author_hindices = true
save_summary_json = true

[experiment]
name = MES - Paper All Transit
description = Papers transfer 100%% of credit, datasets/software keep 100%%
date = 2025-10-26

