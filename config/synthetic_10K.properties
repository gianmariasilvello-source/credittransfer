# Large Graph - Realistic scale
# ~10,000 nodes, complex structure

[general]
seed = 999

[graph]
n_nodes = 10000

[types]
num_types = 2
type_0_name = paper
type_0_proportion = 0.70
type_1_name = dataset
type_1_proportion = 0.30

[density]
# -----------------------------------------------------------------------------
# OUT-DEGREE CONTROL - How many citations each node makes
# -----------------------------------------------------------------------------
# avg_out_degree: Average number of outgoing edges per node (references cited)
#   - This is the PRIMARY parameter for graph density
#   - Directly sets the MEAN of the exponential distribution
#   - Higher value = denser graph (papers cite more references)
#   - Lower value = sparser graph (papers cite fewer references)
#   - Typical values: 10-25 for realistic citation networks
#
# Examples:
#   avg_out_degree = 10  ? Most papers cite 5-15 references
#   avg_out_degree = 25  ? Most papers cite 20-30 references
#   avg_out_degree = 40  ? Most papers cite 35-45 references
avg_out_degree = 25.0

# density_variation: Intended to control variation in out-degree
#   - Range: 0.0 to 1.0
#   - CURRENTLY UNUSED in implementation (reserved for future use)
#   - Variation currently comes from exponential distribution's natural spread
#   - Actual variation: std_dev ? avg_out_degree (exponential property)
#
# Note: If you want more/less variation, consider future implementation or
# modify the exponential distribution in _sample_out_degrees()
density_variation = 0.5

[indegree]
# -----------------------------------------------------------------------------
# IN-DEGREE CONTROL - How citations are distributed (who gets cited)
# -----------------------------------------------------------------------------
# powerlaw_exponent: Controls inequality in citation distribution
#   - Lower (1.5-2.0) = High inequality (few highly-cited papers dominate)
#   - Higher (2.5-3.5) = More equality (citations more evenly distributed)
#   - Typical academic networks: 2.0-2.5
#
# Effect on top papers:
#   powerlaw_exponent = 1.5 ? Top paper might have 1000+ citations
#   powerlaw_exponent = 2.3 ? Top paper might have 200-400 citations
#   powerlaw_exponent = 3.0 ? Top paper might have 50-100 citations
powerlaw_exponent = 2.3

[outdegree]
# -----------------------------------------------------------------------------
# RELATIONSHIP: exp_lambda vs avg_out_degree
# -----------------------------------------------------------------------------
# exp_lambda: Lambda parameter for exponential distribution
#   - CURRENTLY UNUSED in the implementation
#   - Loaded from config but NOT applied in _sample_out_degrees()
#   - The avg_out_degree parameter is used directly instead
#
# ACTUAL IMPLEMENTATION (in generate_synthetic_graph.py):
#   scale = self.config['avg_out_degree']  # <-- Uses avg_out_degree directly
#   out_degrees = np.random.exponential(scale)
#
# MATHEMATICAL RELATIONSHIP (if exp_lambda were used):
#   For exponential distribution: mean = 1/lambda
#   So if implemented: avg_out_degree = 1/exp_lambda
#
#   exp_lambda = 0.35 would give mean ? 2.86
#   exp_lambda = 0.20 would give mean ? 5.0
#   exp_lambda = 0.04 would give mean ? 25.0  (to match avg_out_degree above)
#
# RECOMMENDATION:
#   - To change out-degree, modify avg_out_degree (which actually works)
#   - exp_lambda can be ignored or removed in current implementation
#   - Or, future: implement exp_lambda to control shape independently
exp_lambda = 0.35

[communities]
# -----------------------------------------------------------------------------
# COMMUNITY STRUCTURE - Research subfields/clusters
# -----------------------------------------------------------------------------
# n_communities: Number of distinct research communities/subfields
#   - Higher value = more specialized subfields
#   - Lower value = broader research areas
#   - Typical: 5-25 for realistic academic networks
n_communities = 15

# within_community_prob: Probability of citing within same community
#   - Higher (0.7-0.9) = Strong community boundaries (isolated subfields)
#   - Lower (0.4-0.6) = Weak community boundaries (interdisciplinary)
#   - Typical: 0.6-0.7 for realistic networks
within_community_prob = 0.65

# between_community_prob: Probability of citing across communities
#   - Should be: between_community_prob = 1 - within_community_prob
#   - Or set independently for asymmetric cross-citing
#   - Note: Probabilities don't need to sum to 1.0 (normalized internally)
between_community_prob = 0.35

[structure]
# -----------------------------------------------------------------------------
# GRAPH STRUCTURE - Transitivity and hierarchy
# -----------------------------------------------------------------------------
# transitivity_prob: Probability of forming citation triangles
#   - Definition: If A?B and B?C, probability that A?C
#   - Higher (0.5-0.7) = High clustering, strong transitivity
#   - Lower (0.1-0.3) = Low clustering, weak transitivity
#   - Effect: Creates local citation clusters
#   - Typical: 0.2-0.4 for realistic networks
transitivity_prob = 0.35

# hierarchy_levels: Number of hierarchical levels in the network
#   - Papers are assigned to levels 0, 1, 2, ..., hierarchy_levels-1
#   - Papers tend to cite "upward" to higher levels (foundational work)
#   - Higher value = more fine-grained hierarchy
#   - Typical: 5-10 levels
hierarchy_levels = 7

# level_bias: Strength of upward citation bias
#   - Higher (0.8-1.0) = Strong preference for citing higher levels
#   - Lower (0.3-0.5) = Weak preference, more cross-level citing
#   - 0.0 = No hierarchical bias (random level citation)
#   - Effect: Controls how "foundational" certain papers are cited
level_bias = 0.6

[citation_preferences]
# -----------------------------------------------------------------------------
# TYPE-SPECIFIC CITATION PATTERNS
# -----------------------------------------------------------------------------
# Format: type_X_cites = target_type:weight, target_type:weight, ...
#
# NOTE: only two types in this example (0 and 1), so type_2_cites is ignored
#
# Controls which types cite which other types preferentially
# Weights are relative (normalized automatically)
#
# Example: type_0_cites = 0:1.0, 1:0.4, 2:0.15
#   - Type 0 (papers) cites type 0 with weight 1.0 (papers cite papers often)
#   - Type 0 cites type 1 with weight 0.4 (papers cite datasets sometimes)
#   - Type 0 cites type 2 with weight 0.15 (papers rarely cite software)
#
# Effect:
#   - Equal weights (1.0, 1.0, 1.0) = No preference, cite all types equally
#   - Skewed weights (1.0, 0.1, 0.1) = Strong preference for one type
#
# Type 0 (papers) citation pattern:
type_0_cites = 0:1.0, 1:0.4

# Type 1 (datasets) citation pattern:
type_1_cites = 0:0.8, 1:0.9

# Type 2 (software) - Note: Only 2 types defined above, so this is ignored
#type_2_cites = 0:0.6, 1:0.6

[authors]
# -----------------------------------------------------------------------------
# AUTHOR GENERATION - For h-index and authorship analysis
# -----------------------------------------------------------------------------
# n_authors: Total number of unique authors
#   - Should be less than n_nodes (multiple papers per author)
#   - Typical ratio: 1 author per 3-5 papers
#   - Higher value = more authors, lower productivity per author
n_authors = 3000

# avg_authors_per_node: Average number of authors per paper
#   - Typical: 2-4 for individual papers, 5-10 for collaborations
#   - Actual number sampled from gamma distribution centered here
#   - Range is clipped to [1, 10] per paper
avg_authors_per_node = 3.5

# productivity_exponent: Controls author productivity distribution
#   - Uses power-law: few highly productive authors, many with few papers
#   - Higher (2.0-3.0) = More equal productivity
#   - Lower (1.0-1.5) = Strong inequality (few authors dominate)
#   - Typical academic: 1.5-2.5
#   - Effect: Creates realistic "star researcher" phenomenon
productivity_exponent = 1.8

[output]
# -----------------------------------------------------------------------------
# OUTPUT FILES - Where to save generated graph
# -----------------------------------------------------------------------------
# output_dir: Directory to save all output files
output_dir = data/synthetic_10K

# output_prefix: Prefix for all generated files
#   Files created: {prefix}_edges.txt, {prefix}_adjacency.txt, etc.
output_prefix = 10K_citation

# save_dense_adjacency: Whether to save NxN adjacency matrix
#   - true: Save dense matrix (human-readable, large file size)
#   - false: Skip dense matrix, only save edgelist (recommended for large graphs)
#   - Edgelist is always saved regardless of this setting
#
# File size comparison for 10,000 nodes:
#   - Dense adjacency: ~100 MB - 1 GB (depending on density)
#   - Edgelist: ~1-10 MB (much smaller, faster to load)
#
# Recommendation:
#   - Small graphs (<1,000 nodes): true (matrix is readable)
#   - Large graphs (>10,000 nodes): false (saves space and time)

save_dense_adjacency = false

